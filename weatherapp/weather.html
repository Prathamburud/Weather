<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Application</title>
    <link rel="stylesheet" href="./weather.css">
</head>

<body>
    <div class="card">

        <!-- search -->
        <div class="search">
            <input type="text" placeholder="Search City" spellcheck="false" class="searchinp">
            <button class="searchbtn">
                <img src="./search.png" alt="" class="search-icon">
            </button>
        </div>

        <!-- error -->
        <div class="error">
            <p>Invalid City Name</p>
        </div>

        <!-- weather -->
        <div class="weather">
            <img src="./heavy-rain.png" alt="" class="weather-icon">
            <h1 class="temp">22°C</h1>
            <h2 class="city">Bangalore</h2>


            <!-- details -->
            <div class="details">

                <!-- Humidity -->
                <div class="col">
                    <img src="./humidity.png" alt="">
                    <p class="humidity">50%</p>
                    <p>Humidity</p>
                </div>

                <!-- wind -->
                <div class="col">
                    <img src="./smoke.png" alt="">
                    <p class="wind">50 km/hr</p>
                    <p>Wind Speed</p>
                </div>

            </div>

        </div>

    </div>

    <script src="./weather.js"></script>

</body>

</html>
